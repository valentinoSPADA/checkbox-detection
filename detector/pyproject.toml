# Lint and test configuration for the detection sidecar.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# Module-level import placement is relaxed in tests, which insert the package root on
# sys.path before importing; and the magic-value rule fires constantly on pixel geometry,
# where the literal *is* the meaning.
ignore = ["E402", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# FastAPI's dependency-injection style *requires* calling File()/Query() in parameter
# defaults; B008 is a true positive in ordinary Python and a false one here.
"app/*" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["engine"]
omit = ["*/tests/*", "*/training/*"]
