# Brings up the whole system with one command:
#
#   docker compose up --build
#
# Three separate containers rather than one, because process separation is part of the design
# rather than an accident: the Go gateway and the Python engine have different runtimes,
# different scaling characteristics (the gateway is I/O-bound, the engine CPU-bound), and in
# production would sit behind different autoscaling rules. Collapsing them into one image
# "for simplicity" would misrepresent the architecture the writeup describes.

services:
  detector:
    build:
      context: ./detector
    # Not published to the host. The engine is an internal dependency of the API, and
    # exposing it would offer an unauthenticated compute endpoint to anything on the host.
    # Uncomment the ports block below when debugging the engine directly.
    # ports:
    #   - "8000:8000"
    expose:
      - "8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ORT_THREADS: "1"
      # glibc keeps a per-thread arena and hands freed pages back reluctantly, so a process
      # that peaks at ~200 MB per page settles at the high-water mark of all of them: RSS
      # climbed to 1.2 GB over four requests before this. Two arenas and an eager trim
      # threshold cost a little allocator contention on a single-worker service and keep
      # steady-state memory near the working set instead of near the sum of past peaks.
      MALLOC_ARENA_MAX: "2"
      MALLOC_TRIM_THRESHOLD_: "131072"
      # Memory guards, enforced at the one place an upload is decoded. A byte limit at the
      # gateway cannot see these: compression ratio is chosen by the caller.
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-40000000}
      MIN_IMAGE_SIDE: ${MIN_IMAGE_SIDE:-32}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys, json
          r = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4))
          sys.exit(0 if r.get('model_loaded') else 1)
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    build:
      context: ./backend
      args:
        VERSION: ${VERSION:-dev}
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      DETECTOR_URL: "http://detector:8000"
      DEFAULT_ENGINE: ${DEFAULT_ENGINE:-local}
      MIN_CONFIDENCE: ${MIN_CONFIDENCE:-0.90}
      # Bounds what arrives. What the decoded image costs is bounded in the sidecar, where
      # the decode happens -- see MAX_IMAGE_PIXELS below.
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      detector:
        # Waits for the engine's model to load, not merely for its container to start.
        # Without this the API's first requests fail with 503 during every cold start.
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: ./frontend
      args:
        # The address the *browser* uses. The compose-internal hostname would not resolve
        # outside the network, so this must be the published host port.
        VITE_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
