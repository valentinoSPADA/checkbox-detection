# Continuous integration.
#
# Three independent jobs so a frontend lint error does not hide a backend test failure, and
# so each reports its own duration. They run in parallel; the aggregate quality gate and the
# image build depend on all three passing.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run: on a series of quick fixes the
# earlier results are stale anyway, and queuing them just delays the one that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Verify formatting
        # gofmt exits 0 even when it reports files, so the file list itself is the signal.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        # Catches a dependency added without tidying, which otherwise breaks the Docker
        # build much later and much more confusingly.
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Enforce coverage floors
        # Two gates rather than one. The overall floor catches a whole package shipping
        # untested; the domain floor is stricter because that package is where a wrong
        # answer actually comes from, and it can be tested with no I/O at all.
        #
        # cmd/api is excluded from the overall figure and reports 0%: it is the composition
        # root, whose only statements are the wiring that every other test already exercises
        # through its own dependencies. Testing it would assert that main() calls the
        # constructors, which is a tautology, not a safeguard.
        run: |
          overall=$(go tool cover -func=coverage.out | tail -1 | awk '{gsub("%","",$3); print $3}')
          domain=$(go tool cover -func=coverage.out \
            | grep -E 'internal/domain/(box|policy|detection)\.go' \
            | awk '{gsub("%","",$3); s+=$3; n++} END {if (n>0) printf "%.1f", s/n; else print "0"}')
          echo "overall: ${overall}%   domain: ${domain}%"
          awk -v p="$overall" 'BEGIN { exit (p+0 >= 80) ? 0 : 1 }' || {
            echo "overall coverage ${overall}% is below the 80% floor"; exit 1; }
          awk -v p="$domain" 'BEGIN { exit (p+0 >= 90) ? 0 : 1 }' || {
            echo "domain coverage ${domain}% is below the 90% floor"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out

      - name: Build
        run: go build ./...

  detector:
    name: Detector (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: detector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: detector/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test with coverage
        # Stage 1 and the preprocessing are covered here. The training package is excluded
        # from the gate: it is a developer tool that produces an artifact, and asserting on
        # a stochastic training loop would buy a flaky test rather than confidence.
        run: pytest --cov=engine --cov-report=xml --cov-report=term-missing --cov-fail-under=85

      - uses: actions/upload-artifact@v4
        with:
          name: detector-coverage
          path: detector/coverage.xml

  frontend:
    name: Frontend (React/TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info

      - name: Build
        run: npm run build

  quality:
    name: SonarCloud (duplication + quality gate)
    runs-on: ubuntu-latest
    needs: [backend, detector, frontend]
    # Skipped on forks, where the secret is unavailable and the step would fail for reasons
    # unrelated to the contributor's change.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar needs full history to attribute issues to "new code" rather than
          # reporting the entire repository as newly written on every run.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend

      - uses: actions/download-artifact@v4
        with:
          name: detector-coverage
          path: detector

      - uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Duplication is the pillar this job exists for: the same box geometry is expressed
        # in two languages by necessity, and Sonar is what keeps that from quietly spreading
        # into a third and fourth copy.
        continue-on-error: ${{ secrets.SONAR_TOKEN == '' }}

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, detector, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build detector image
        uses: docker/build-push-action@v6
        with:
          context: ./detector
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the deployment image
        # A different artifact from the three above, not a repackaging of them: one container
        # with the Go binary serving an embedded bundle and the sidecar on loopback. It has
        # its own way to break -- an embed that missed the build, an entrypoint with the
        # wrong line endings -- and both of those have happened here.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: checkbox-detection:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the deployment image under its production memory limit
        # Capped at 512 MB deliberately: that is what fly.toml requests, and detection peaks
        # at ~215 MB inside it. A regression that pushes peak memory past the limit is an OOM
        # kill in production and a passing test suite everywhere else, so the limit is part of
        # the test rather than a note in a document.
        run: |
          docker run -d --name deploy-smoke -p 8099:8080             --memory=512m --memory-swap=512m checkbox-detection:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8099/ready > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8099/ready
          # The UI must be served by the same binary that answers /detect; a 404 here means
          # the embed picked up the committed placeholder instead of the built bundle.
          curl -fsS http://localhost:8099/ | grep -qi "<div id=\"root\""             || { echo "the embedded UI is the placeholder, not the built bundle"; exit 1; }
          curl -fsS -X POST -F "file=@samples/sample_1_urar_1004.png"             "http://localhost:8099/detect" -o deploy.json
          python3 -c "import json; d=json.load(open('deploy.json'));             assert len(d['boxes']) > 50, d; print('deployment image detected', len(d['boxes']))"
          test "$(docker inspect -f '{{.State.OOMKilled}}' deploy-smoke)" = "false"             || { echo "the container was OOM-killed at its production memory limit"; exit 1; }
          docker rm -f deploy-smoke

      - name: Smoke test the composed stack
        # Proves the pieces actually talk to each other. A green unit-test suite plus three
        # images that build says nothing about whether the API can reach the sidecar, and
        # that wiring is exactly what breaks between commits.
        run: |
          docker compose up --build -d
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/ready > /dev/null; then break; fi
            sleep 3
          done
          curl -fsS http://localhost:8080/ready
          curl -fsS -X POST -F "file=@samples/sample_1_urar_1004.png" \
            "http://localhost:8080/detect" -o result.json
          python3 -c "import json,sys; d=json.load(open('result.json')); \
            assert isinstance(d['boxes'], list), d; \
            print('detected', len(d['boxes']), 'checkboxes')"
          docker compose down -v

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: [images, quality]

    # MANUAL ONLY, and that is a decision rather than an omission.
    #
    # The challenge asks for build and run instructions, not a hosted URL, so nothing is
    # published. What is wired here is a real deploy rather than a stub: the image it ships is
    # built and smoke-tested by the job above, under the same 512 MB limit fly.toml requests.
    # Running it needs one secret and one `fly launch`.
    #
    # Manual rather than on-push because an automatic deploy without FLY_API_TOKEN configured
    # is a permanently red pipeline that says nothing about the code. A red build should mean
    # something is broken.
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://checkbox-detection.fly.dev
    steps:
      - uses: actions/checkout@v4

      - name: Require a deploy token
        # Checked in a step, not in the job's `if`: the secrets context is not available in a
        # job-level condition. Failing here with a sentence is better than failing inside
        # flyctl with an auth error that reads like an outage.
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "FLY_API_TOKEN is not configured."
            echo "Create one with 'fly tokens create deploy' and add it to the repository secrets."
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        # `--wait-timeout` exceeds the health check's grace period, so the job fails on a
        # machine that never becomes ready rather than reporting success and leaving the old
        # one serving. Fly keeps the previous machine until the new one passes, so a failed
        # deploy is a no-op rather than an outage.
        run: flyctl deploy --remote-only --wait-timeout 300 --build-arg VERSION=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify the deployed instance answers
        # The health check proves the process is up. This proves it can still detect: a model
        # artifact missing from the image passes readiness and fails every request.
        run: |
          curl -fsS --retry 5 --retry-delay 5 https://checkbox-detection.fly.dev/ready
          curl -fsS -X POST -F "file=@samples/sample_1_urar_1004.png"             https://checkbox-detection.fly.dev/detect -o live.json
          python3 -c "import json; d=json.load(open('live.json'));             assert len(d['boxes']) > 50, d; print('live instance detected', len(d['boxes']))"
