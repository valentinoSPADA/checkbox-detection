# SonarCloud configuration.
#
# The duplication check is the reason this exists. This repository expresses box geometry in
# two languages by necessity -- Python owns the pixels, Go owns the policy -- and that is a
# standing invitation for the same logic to be copied a third and fourth time. Sonar is the
# automated backstop for the manual reuse pass.

sonar.projectKey=vspada_checkbox-detection
sonar.organization=vspada
sonar.projectName=Checkbox Detection
sonar.projectVersion=1.0

sonar.sources=backend,detector,frontend/src
sonar.tests=backend,detector/tests,frontend/src
sonar.test.inclusions=**/*_test.go,**/test_*.py,**/*.test.ts,**/*.test.tsx

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/__pycache__/**,**/*.onnx,samples/**,docs/**

# Coverage reports produced by the CI jobs and downloaded into place before the scan.
sonar.go.coverage.reportPaths=backend/coverage.out
sonar.python.coverage.reportPaths=detector/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8

# Sonar's default duplication threshold is kept rather than relaxed. Raising it to make a
# build pass would defeat the only purpose of running the check.
